name: Keep admin service awake

on:
  schedule:
    # Keep warm 11:00 AM-1:00 AM IST. GitHub schedules use UTC, so wake at
    # 10:50 AM IST to finish Render's cold start before the operating window.
    - cron: "20-59/10 5 * * *"
    - cron: "*/10 6-18 * * *"
    - cron: "0-30/10 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-admin-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check admin health
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            https://admin.ursmajestic.com/health
