<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; color: #14201B; }
  h1 { font-size: 15px; margin: 0 0 8px; color: #062013; }
  label { display: block; font-weight: 600; margin: 8px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #ccc; border-radius: 6px; font: 12px monospace; }
  button { margin: 8px 6px 0 0; padding: 7px 12px; border: 0; border-radius: 6px; background: #062013; color: #E9C55A; font-weight: 600; cursor: pointer; }
  button.alt { background: #eee; color: #14201B; }
  #st { margin-top: 10px; padding: 8px; border-radius: 6px; background: #F3F2EC; }
  #st.ok { background: #E8F5EE; color: #1E8A5A; } #st.bad { background: #FBEAE6; color: #C2412D; }
  small { color: #777; }
  label.chk { display: flex; gap: 6px; align-items: flex-start; font-weight: 500; margin: 10px 0 0; }
  label.chk input { width: auto; margin-top: 3px; }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; } input[type=time] { font: 13px system-ui; }
</style>
</head>
<body>
  <h1>URS Live Stock Feed</h1>
  <small>Reads Petpooja's item report about every 10 minutes, <b>only during the restaurant's hours below</b>, and sends it to the Live stock tab. Read only.</small>
  <label for="code">Helper code</label>
  <input id="code" type="password" placeholder="urslf_..." autocomplete="off">
  <div class="row">
    <div><label for="open">Opens</label><input id="open" type="time"></div>
    <div><label for="close">Closes</label><input id="close" type="time"></div>
  </div>
  <label class="chk"><input id="zomato" type="checkbox" checked> Include Zomato orders (Chrome must be signed in to Zomato)</label>
  <button id="save">Save &amp; test</button><button id="run" class="alt">Read now</button>
  <div id="st">Loading…</div>
  <script src="popup.js"></script>
</body>
</html>
