# Public website (ursmajestic.com) on Netlify, built from frontend/.
# The admin backend deploys separately on Render; most pushes only touch
# backend/, so Netlify skips the build unless something in frontend/ changed.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "20"
