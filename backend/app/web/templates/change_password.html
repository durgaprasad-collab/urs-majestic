{% extends "base.html" %}
{% block title %}Change Password — URS Majestic{% endblock %}

{% block content %}
<div class="card">
  <h1 class="card-title">Change password</h1>

  {% if error %}
  <p class="alert-error">{{ error }}</p>
  {% endif %}
  {% if success %}
  <p class="alert-success">{{ success }}</p>
  {% endif %}

  <form method="post" action="/change-password">
    <label for="current_password" class="form-label">Current password</label>
    <input id="current_password" name="current_password" type="password"
           class="form-input" required autocomplete="current-password" />

    <label for="new_password" class="form-label" style="margin-top:.75rem">New password</label>
    <input id="new_password" name="new_password" type="password"
           class="form-input" required minlength="6" autocomplete="new-password" />

    <label for="confirm_password" class="form-label" style="margin-top:.75rem">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password"
           class="form-input" required minlength="6" autocomplete="new-password" />

    <button type="submit" class="btn-primary">Update password</button>
  </form>
</div>
{% endblock %}
