{% extends "base.html" %}
{% block title %}Sign in — URS Majestic{% endblock %}

{% block content %}
<div class="card">
  <h1 class="card-title">Welcome back 👋</h1>
  <p class="card-sub">Enter your PIN to continue.</p>

  {% if error %}
  <p class="alert-error">{{ error }}</p>
  {% endif %}

  <form method="post" action="/pin">
    <label for="pin" class="form-label">PIN</label>
    <input
      id="pin"
      name="pin"
      type="password"
      inputmode="numeric"
      autocomplete="current-password"
      class="form-input"
      placeholder="Enter PIN"
      style="text-align:center;letter-spacing:.4em;font-size:1.3rem"
      autofocus
      required
    />
    <button type="submit" class="btn-primary fab" style="width:100%;margin-top:.75rem">Sign in →</button>
  </form>
</div>
{% endblock %}
