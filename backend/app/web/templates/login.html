{% extends "base.html" %}
{% block title %}Sign In — URS Majestic{% endblock %}

{% block guest_content %}
<div class="card">
  <h1 class="card-title">Welcome back 👋</h1>
  <p class="card-sub">Sign in to your URS Majestic owner portal.</p>

  {% if error %}
  <p class="alert-error">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login">
    <label for="username" class="form-label">Username</label>
    <input id="username" name="username" type="text" class="form-input"
           autocomplete="username" required autofocus />

    <label for="password" class="form-label" style="margin-top:.75rem">Password</label>
    <input id="password" name="password" type="password" class="form-input"
           autocomplete="current-password" required />

    <button type="submit" class="btn-primary fab" style="width:100%;margin-top:.75rem">Sign in →</button>
  </form>
</div>
{% endblock %}
